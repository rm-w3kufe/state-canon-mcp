name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    
    - name: Run tests
      env:
        GIT_AUTHOR_NAME: rmw3
        GIT_AUTHOR_EMAIL: rmw3kufe@proton.me
        GIT_COMMITTER_NAME: rmw3
        GIT_COMMITTER_EMAIL: rmw3kufe@proton.me
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Verify server starts
      run: |
        echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | python3 mcp_server.py --microstack corpus/microstack
